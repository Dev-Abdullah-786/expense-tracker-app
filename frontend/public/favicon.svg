<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square with gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="64" height="32" rx="14" fill="url(#shine)"/>

  <!-- Wallet body -->
  <rect x="10" y="20" width="44" height="28" rx="5" fill="white" fill-opacity="0.95"/>

  <!-- Wallet flap -->
  <rect x="10" y="16" width="44" height="10" rx="4" fill="white" fill-opacity="0.7"/>

  <!-- Coin slot / pocket -->
  <rect x="36" y="26" width="14" height="14" rx="4" fill="#0d9488" fill-opacity="0.15"/>
  <circle cx="43" cy="33" r="4" fill="#0d9488" fill-opacity="0.9"/>

  <!-- Three lines representing cash -->
  <rect x="14" y="27" width="16" height="2.5" rx="1.25" fill="#0d9488" fill-opacity="0.5"/>
  <rect x="14" y="32" width="12" height="2.5" rx="1.25" fill="#0d9488" fill-opacity="0.35"/>
  <rect x="14" y="37" width="14" height="2.5" rx="1.25" fill="#0d9488" fill-opacity="0.35"/>
</svg>
